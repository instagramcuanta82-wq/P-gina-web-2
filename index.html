<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <!-- ETIQUETA DE SEARCH CONSOLE -->
    <meta name="google-site-verification" content="Tv17bWhX0JE59lWgAMOcgnG4iPG2GJ__QFh4DNoHIf0" />

    <title>Omegle x</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Mini Omegle</h1>

    <div class="videos">
        <div>
            <h3>Tú</h3>
            <video id="localVideo" autoplay playsinline></video>
        </div>

        <div>
            <h3>Extraño</h3>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <div class="controls">
        <button id="connectBtn">Conectar</button>
        <button id="nextBtn" disabled>Siguiente</button>
        <button id="leaveBtn" disabled>Salir</button>
    </div>

    <div class="chat-area">
        <div id="messages"></div>
        <input id="messageInput" type="text" placeholder="Escribe un mensaje..." />
        <button id="sendBtn">Enviar</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
