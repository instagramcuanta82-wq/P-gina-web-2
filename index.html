<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <!-- VERIFICACIÓN DE GOOGLE -->
    <meta name="google-site-verification" content="Tv17bWhX0JE59lWgAMOcgnG4iPG2GJ__QFh4DNoHIf0" />

    <title>Omega X</title>

    <!-- ESTILOS MODERNOS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main-container">

        <h1 class="title">Omega X</h1>

        <!-- SOLO VIDEO DEL EXTRAÑO -->
        <div class="video-box">
            <video id="remoteVideo" autoplay playsinline></video>
        </div>

        <!-- CONTROLES -->
        <div class="controls">
            <button id="connectBtn" class="btn primary">Conectar</button>
            <button id="nextBtn" class="btn warning" disabled>Siguiente</button>
            <button id="leaveBtn" class="btn danger" disabled>Salir</button>
        </div>

        <!-- CHAT -->
        <div class="chat-area">
            <div id="messages" class="messages"></div>

            <div class="chat-input">
                <input type="text" id="messageInput" placeholder="Escribe un mensaje...">
                <button id="sendBtn" class="btn send">Enviar</button>
            </div>
        </div>

        <!-- MODO OSCURO -->
        <button id="darkModeBtn" class="dark-toggle">🌙</button>

    </div>

    <script src="script.js"></script>
</body>
</html>
