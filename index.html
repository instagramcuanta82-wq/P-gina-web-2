<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Omega X</title>

  <!-- (Si querés) etiqueta de verificación de Google ya la tenés en tu index si hace falta -->
  <!-- <meta name="google-site-verification" content="Tv17bWhX0JE59lWgAMOcgnG4iPG2GJ__QFh4DNoHIf0" /> -->

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Omega X</h1>
    <button id="themeToggle" class="theme-btn" title="Cambiar tema">🌙</button>
  </header>

  <main class="container">
    <!-- VIDEO GRANDE (solo remoto) -->
    <section class="video-area">
      <div class="video-wrapper">
        <video id="remoteVideo" autoplay playsinline></video>
        <div id="overlayStatus" class="overlay">Desconectado</div>
      </div>
    </section>

    <!-- CONTROLES -->
    <section class="controls">
      <button id="connectBtn" class="btn primary">Conectar</button>
      <button id="nextBtn" class="btn" disabled>Siguiente</button>
      <button id="leaveBtn" class="btn danger" disabled>Salir</button>
    </section>

    <!-- CHAT -->
    <section class="chat">
      <div id="messages" class="messages"></div>

      <div class="input-row">
        <input id="messageInput" type="text" placeholder="Escribe un mensaje..." />
        <button id="sendBtn" class="btn small">Enviar</button>
      </div>
    </section>

    <footer class="footer">
      <small>Servidor: <span id="serverUrl">wss://omegle-server-5i11.onrender.com</span></small>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
