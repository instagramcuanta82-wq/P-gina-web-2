<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <!-- VERIFICACIÓN DE GOOGLE -->
    <meta name="google-site-verification" content="Tv17bWhX0JE59lWgAMOcgnG4iPG2GJ__QFh4DNoHIf0" />

    <title>Mini Omegle</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Mini Omegle</h1>

    <!-- SOLO VIDEO DEL EXTRAÑO -->
    <div class="video-container">
        <h3>Extraño</h3>
        <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <!-- CONTROLES -->
    <div class="controls">
        <button id="connectBtn">Conectar</button>
        <button id="nextBtn" disabled>Siguiente</button>
        <button id="leaveBtn" disabled>Salir</button>
    </div>

    <!-- CHAT -->
    <div class="chat-area">
        <div id="messages"></div>

        <div class="chat-input">
            <input type="text" id="messageInput" placeholder="Escribe un mensaje...">
            <button id="sendBtn">Enviar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
